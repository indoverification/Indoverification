name: Multi-App Production Safety

on:
  pull_request:
    branches: [main]
  push:
    branches: [multi-app-architecture]

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: App registry tests
        run: npm run test:app-registry
      - name: App request isolation tests
        run: npm run test:app-request
      - name: Server syntax check
        run: node --check src/server-multi-app.js
