name: Multi-app safety tests

on:
  push:
    branches: [multi-app-architecture]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/app-registry.test.js
      - run: node src/app-request.test.js
