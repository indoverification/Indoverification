<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{appName}} login verification</title></head>
<body style="margin:0;padding:24px 12px;background:#f5f8fc;color:#152033;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td align="center">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:620px;background:#fff;border:1px solid #dce5f0;border-radius:16px;overflow:hidden;">
<tr><td align="center" style="padding:28px 20px 22px;border-bottom:1px solid #e7edf5;"><div style="font-size:28px;font-weight:900;color:{{primaryColor}};">{{appName}}</div><div style="margin-top:8px;color:#6b778c;font-size:12px;">Secure login verification</div><div style="margin-top:12px;font-size:18px;line-height:1.45;font-weight:800;color:#111827;">Your email is verified by <strong>Indoverification</strong>.</div></td></tr>
<tr><td style="padding:30px 26px;"><h1 style="margin:0 0 10px;font-size:26px;text-align:center;">Login verification</h1><p style="margin:0;color:#526177;font-size:15px;line-height:1.7;">Use this code to securely complete your {{appName}} login.</p>
<div style="margin:22px 0;padding:20px;background:#f7f9fc;border:1px solid #dce5f0;border-radius:13px;text-align:center;"><div style="font-size:11px;color:#7b8799;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;">Your OTP code</div><div style="margin-top:10px;font-size:34px;letter-spacing:9px;font-weight:900;color:{{primaryColor}};">{{code}}</div></div>
<p style="margin:0;text-align:center;color:#7b8799;font-size:13px;">This OTP is valid for <strong style="color:{{primaryColor}};">{{minutes}} minutes</strong>.</p></td></tr>
<tr><td align="center" style="padding:18px 20px;background:#f8fafc;border-top:1px solid #e7edf5;color:#7b8799;font-size:12px;line-height:1.7;">Automated email from <strong style="color:{{primaryColor}};">{{appName}}</strong>. Please do not share your OTP.</td></tr>
</table></td></tr></table></body></html>
